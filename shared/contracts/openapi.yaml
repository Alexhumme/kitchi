openapi: 3.0.3
info:
  title: Kitchi Studio API
  version: 0.1.0
  description: API REST del editor de gatos chibi y generador de stickers.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalida el token presentado; al volver a iniciar sesión se genera
        uno nuevo.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Alta de cuenta y entrega inmediata de token (AC-06).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/catalog/:
    get:
      operationId: catalog_list
      description: Opciones activas agrupadas por categoría, más las poses (P08 ·
        `/api/catalog/`).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - catalog
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogOptionList'
          description: ''
  /api/cats/:
    get:
      operationId: cats_list
      description: '`GET/POST /api/cats/`: lista los gatos propios y crea uno con
        el límite aplicado.'
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - cats
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatList'
          description: ''
    post:
      operationId: cats_create
      description: '`GET/POST /api/cats/`: lista los gatos propios y crea uno con
        el límite aplicado.'
      tags:
      - cats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cat'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
          description: ''
  /api/cats/{id}/:
    get:
      operationId: cats_retrieve
      description: '`GET/PATCH/DELETE /api/cats/{id}/`: acceso restringido al dueño
        o a un admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cats
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
          description: ''
    patch:
      operationId: cats_partial_update
      description: '`GET/PATCH/DELETE /api/cats/{id}/`: acceso restringido al dueño
        o a un admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCat'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cat'
          description: ''
    delete:
      operationId: cats_destroy
      description: '`GET/PATCH/DELETE /api/cats/{id}/`: acceso restringido al dueño
        o a un admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cats
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: Verificación de disponibilidad (03_ARCHITECTURE.md · Documentación
        de la API).
      tags:
      - health
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/poses/:
    get:
      operationId: poses_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - poses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPoseList'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      description: 'Respuesta de registro y login: token de sesión más el usuario
        actual.'
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - token
      - user
    Cat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        configuration:
          description: Documento validado contra el catálogo.
        schema_version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - schema_version
      - updated_at
    CatalogOption:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryEnum'
        code:
          type: string
          description: Identificador estable enviado por la interfaz.
          maxLength: 60
        label:
          type: string
          maxLength: 80
        asset_path:
          type: string
          maxLength: 255
        z_order:
          type: integer
          maximum: 65535
          minimum: 0
          description: Orden explícito de composición.
        is_premium:
          type: boolean
      required:
      - category
      - code
      - label
    CategoryEnum:
      enum:
      - fur
      - eyes
      - hair
      - top
      - bottom
      - accessory
      type: string
      description: |-
        * `fur` - Pelaje
        * `eyes` - Ojos
        * `hair` - Cabello
        * `top` - Parte superior
        * `bottom` - Parte inferior
        * `accessory` - Accesorio
    DatabaseEnum:
      enum:
      - up
      - down
      type: string
      description: |-
        * `up` - up
        * `down` - down
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        database:
          $ref: '#/components/schemas/DatabaseEnum'
        engine:
          type: string
          description: Motor de base de datos en uso (mysql o sqlite).
      required:
      - database
      - engine
      - status
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Dirección de correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        role:
          type: string
          readOnly: true
        premium:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          title: Fecha de alta
      required:
      - id
      - premium
      - role
      - username
    PaginatedCatList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Cat'
    PaginatedCatalogOptionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOption'
    PaginatedPoseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Pose'
    PatchedCat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        configuration:
          description: Documento validado contra el catálogo.
        schema_version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Pose:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 80
        asset_path:
          type: string
          maxLength: 255
      required:
      - code
      - name
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
