[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchi-frontend"
version = "0.1.0"
description = "Interfaz web móvil de Kitchi Studio (Flet). Integrante A — frontend y UX."
requires-python = ">=3.11"
dependencies = [
    "flet[web]==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"